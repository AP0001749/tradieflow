name: TradieFlow Supabase Follow-up Check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: follow-up-processor
  cancel-in-progress: false

jobs:
  invoke-follow-up-processor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke lead-followup Edge Function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LEAD_FOLLOWUP_SECRET: ${{ secrets.LEAD_FOLLOWUP_SECRET }}
        run: |
          SUPABASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n' | xargs)"
          SUPABASE_ANON_KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '\r\n' | xargs)"
          LEAD_FOLLOWUP_SECRET="$(printf '%s' "$LEAD_FOLLOWUP_SECRET" | tr -d '\r\n' | xargs)"

          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Missing SUPABASE_URL secret"
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_ANON_KEY secret"
            exit 1
          fi
          if [ -z "$LEAD_FOLLOWUP_SECRET" ]; then
            echo "::error::Missing LEAD_FOLLOWUP_SECRET secret"
            exit 1
          fi

          EDGE_URL="${SUPABASE_URL}/functions/v1/lead-followup"
          echo "Invoking: $EDGE_URL"

          STATUS="$(curl -sS -o response.json -w '%{http_code}' -X POST "$EDGE_URL" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "x-cron-secret: ${LEAD_FOLLOWUP_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"source":"github-heartbeat"}' \
            --retry 2 \
            --retry-delay 5 || true)"

          BODY="$(tr '\n' ' ' < response.json | sed 's/[[:space:]]\+/ /g' | cut -c1-500)"

          {
            echo "## TradieFlow Follow-up Check"
            echo ""
            echo "- URL: \`$EDGE_URL\`"
            echo "- Status: $STATUS"
            echo "- Response: $BODY"
            echo "- Timestamp: $(date -u)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Lead follow-up invoked successfully (HTTP $STATUS)"
          else
            echo "::error title=Lead follow-up Edge Function failed::HTTP $STATUS — $BODY"
            exit 1
          fi
