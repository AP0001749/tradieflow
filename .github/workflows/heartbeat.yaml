name: TradieFlow Supabase Follow-up Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  invoke-follow-up-processor:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deployed follow-up route
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          APP_URL="${APP_BASE_URL:-https://gettradieflow.com}"
          STATUS="$(curl -sS -D probe.headers -o probe.json -w '%{http_code}' -X POST "${APP_URL}/api/cron/leads-followup" || true)"
          ROUTE_HEADER="$(grep -i '^x-tradieflow-followup-route:' probe.headers | tail -n1 | cut -d':' -f2- | xargs)"
          AUTH_HEADER="$(grep -i '^x-tradieflow-followup-auth:' probe.headers | tail -n1 | cut -d':' -f2- | xargs)"
          BODY="$(tr '\n' ' ' < probe.json | sed 's/[[:space:]]\+/ /g' | cut -c1-400)"
          {
            echo "## TradieFlow Follow-up Route Probe"
            echo
            echo "- URL: ${APP_URL}/api/cron/leads-followup"
            echo "- Probe Status: ${STATUS}"
            echo "- Probe Route Header: ${ROUTE_HEADER:-missing}"
            echo "- Probe Auth Header: ${AUTH_HEADER:-missing}"
            echo "- Probe Response: ${BODY}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate required secrets
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          LEAD_FOLLOWUP_SECRET: ${{ secrets.LEAD_FOLLOWUP_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "${APP_BASE_URL:-https://gettradieflow.com}" || (echo "Missing app URL" && exit 1)
          test -n "$LEAD_FOLLOWUP_SECRET$CRON_SECRET" || (echo "Missing LEAD_FOLLOWUP_SECRET/CRON_SECRET secret" && exit 1)

      - name: Invoke TradieFlow Lead Follow-up Route
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          LEAD_FOLLOWUP_SECRET: ${{ secrets.LEAD_FOLLOWUP_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_BASE_URL:-https://gettradieflow.com}"
          LAST_STATUS=""
          LAST_BODY=""
          mapfile -t SECRETS < <(printf '%s\n%s\n' "$LEAD_FOLLOWUP_SECRET" "$CRON_SECRET" | awk 'NF && !seen[$0]++')
          for SECRET in "${SECRETS[@]}"; do
            echo "Trying /api/cron/leads-followup with one configured secret candidate..."
            STATUS="$(curl -sS -D response.headers -o response.json -w '%{http_code}' -X POST "${APP_URL}/api/cron/leads-followup" \
              -H "Authorization: Bearer ${SECRET}" \
              -H "x-cron-secret: ${SECRET}" \
              --retry 2 \
              --retry-delay 5 || true)"
            BODY="$(tr '\n' ' ' < response.json | sed 's/[[:space:]]\+/ /g' | cut -c1-400)"
            ROUTE_HEADER="$(grep -i '^x-tradieflow-followup-route:' response.headers | tail -n1 | cut -d':' -f2- | xargs)"
            AUTH_HEADER="$(grep -i '^x-tradieflow-followup-auth:' response.headers | tail -n1 | cut -d':' -f2- | xargs)"
            echo "HTTP ${STATUS}"
            cat response.headers
            echo
            cat response.json
            echo
            if [ "${STATUS}" -ge 200 ] && [ "${STATUS}" -lt 300 ]; then
              {
                echo "## TradieFlow Follow-up Check"
                echo
                echo "- URL: ${APP_URL}/api/cron/leads-followup"
                echo "- Status: ${STATUS}"
                echo "- Route Header: ${ROUTE_HEADER:-missing}"
                echo "- Auth Header: ${AUTH_HEADER:-missing}"
                echo "- Response: ${BODY}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            LAST_STATUS="${STATUS}"
            LAST_BODY="${BODY}"
          done
          echo "::error title=TradieFlow follow-up route rejected workflow secret::HTTP ${LAST_STATUS}. Route=${ROUTE_HEADER:-missing}. Auth=${AUTH_HEADER:-missing}. Response: ${LAST_BODY}"
          {
            echo "## TradieFlow Follow-up Check"
            echo
            echo "- URL: ${APP_URL}/api/cron/leads-followup"
            echo "- Final Status: ${LAST_STATUS}"
            echo "- Final Route Header: ${ROUTE_HEADER:-missing}"
            echo "- Final Auth Header: ${AUTH_HEADER:-missing}"
            echo "- Final Response: ${LAST_BODY}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "All configured follow-up secrets were rejected by the app host."
          exit 1
