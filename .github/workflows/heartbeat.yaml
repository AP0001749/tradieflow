name: TradieFlow Supabase Follow-up Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  invoke-follow-up-processor:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          LEAD_FOLLOWUP_SECRET: ${{ secrets.LEAD_FOLLOWUP_SECRET || secrets.CRON_SECRET }}
        run: |
          test -n "${APP_BASE_URL:-https://gettradieflow.com}" || (echo "Missing app URL" && exit 1)
          test -n "$LEAD_FOLLOWUP_SECRET" || (echo "Missing LEAD_FOLLOWUP_SECRET secret" && exit 1)

      - name: Invoke TradieFlow Lead Follow-up Route
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          LEAD_FOLLOWUP_SECRET: ${{ secrets.LEAD_FOLLOWUP_SECRET || secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_BASE_URL:-https://gettradieflow.com}"
          curl -X POST "${APP_URL}/api/cron/leads-followup" \
            -H "Authorization: Bearer ${LEAD_FOLLOWUP_SECRET}" \
            -H "x-cron-secret: ${LEAD_FOLLOWUP_SECRET}" \
            --retry 2 \
            --retry-delay 5 \
            --fail --silent --show-error
